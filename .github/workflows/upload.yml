name: Drive to YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # Runs every 10 minutes

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run upload script
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          PENDING_FOLDER_ID: ${{ secrets.PENDING_FOLDER_ID }}
          PROCESSING_FOLDER_ID: ${{ secrets.PROCESSING_FOLDER_ID }}
          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
          FAILED_FOLDER_ID: ${{ secrets.FAILED_FOLDER_ID }}
          VIDEO_WEBHOOK_SECRET: ${{ secrets.VIDEO_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python upload.py
